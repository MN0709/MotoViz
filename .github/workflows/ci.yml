name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 分支保护按此 job id 识别必需检查，必须与 required status context "quality" 一致。
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 按项目约定安装依赖；package-lock.json 保证解析结果稳定。
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
