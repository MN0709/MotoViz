<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MotoViz · 三车型改装交互 MVP</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/build/three.module.min.js","three/addons/":"./vendor/examples/jsm/"}}</script></head>
<body>
<header><a href="./" class="logo">MOTO<span>VIZ</span></a><span class="tag">三车型改装实验室</span><small>本地模型 · 统一槽位接口</small></header>
<main><section class="stage"><div class="stage-title"><div><span id="vehicleMeta" class="eyebrow">THREE VEHICLE MVP</span><h1>先选车型，<br>再选择改装位置。</h1></div><span id="count" class="pill">加载中</span></div>
<div id="viewer"><div id="loading"><b>正在加载整车</b><span id="progress">准备中…</span></div></div>
<div class="stage-bottom"><div id="status" role="status">选择车型后可旋转、拆解、改色和换件</div><nav><button data-view="left">左侧</button><button data-view="right">右侧</button><button data-view="front">前方</button><button data-view="overview">全景</button><button id="auto">自动旋转</button></nav></div></section>
<aside id="controls" inert>
<div class="section-head"><span>00 / 车型</span><small id="identityStatus"></small></div><select id="vehicle" aria-label="选择车型"></select>
<div class="section-head"><span>01 / 部件位置</span><button id="reset" class="text-btn">一键复原 ↺</button></div><select id="part" aria-label="选择部件"></select><div class="part-info"><b id="selectedName">选择部件</b><small id="partId"></small></div>
<div class="row"><button id="isolate">单独查看</button><button id="hide">隐藏部件</button><button id="show">显示全部</button></div>
<div class="section-head"><span>02 / 展开查看</span><output id="explodeValue">0%</output></div><input id="explode" aria-label="展开程度" type="range" min="0" max="100" value="0"><p class="hint">只移动现有完整部件组，不切碎网格。</p>
<div class="section-head"><span>03 / 改色与贴膜</span><button id="restoreLook" class="text-btn">恢复当前外观</button></div><div class="palette"><button data-color="#a91e29" style="--swatch:#a91e29" aria-label="酒红色"></button><button data-color="#245ea8" style="--swatch:#245ea8" aria-label="蓝色"></button><button data-color="#e8e6df" style="--swatch:#e8e6df" aria-label="珍珠白"></button><button data-color="#252b32" style="--swatch:#252b32" aria-label="石墨黑"></button><button data-color="#3b9b58" style="--swatch:#3b9b58" aria-label="绿色"></button><label>自选 <input id="color" type="color" value="#a91e29" aria-label="自选颜色"></label></div><div class="row"><button id="stripe">条纹贴膜</button><label class="file-button">自选贴膜图<input id="wrapFile" type="file" accept="image/png,image/jpeg,image/webp"></label></div><p class="hint">贴膜仅为网页视觉预览，不是施工裁膜文件。</p>
<div class="section-head"><span>04 / 换部件</span><small id="replaceState"></small></div><div class="row"><label class="file-button wide" id="replacementLabel">导入替换 GLB<input id="replacementFile" type="file" accept=".glb"></label><button id="restorePart">恢复原件</button></div><small id="replacementName">未导入替换件</small><details><summary>调整替换件的位置与大小</summary><p class="hint">先按原部件包围盒粗对齐，再人工校准。</p><label>大小 <input id="replaceScale" type="range" min="0.2" max="2" step="0.01" value="1"></label><label>左右 <input id="replaceX" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label><label>高低 <input id="replaceY" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label><label>前后 <input id="replaceZ" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label><label>转向 <input id="replaceTurn" type="range" min="-180" max="180" step="1" value="0"></label></details>
<p class="boundary">三车型使用同一套 slotKey。车型、模板版本和部件位置共同决定改装件挂载目标；当前属于视觉 MVP，未证明真实安装适配。</p></aside></main><script type="module" src="app.js"></script></body></html>
